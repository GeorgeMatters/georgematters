gallery:
  kicker: "Galerie"
  headline: "Eindrücke zwischen Bühne, Anlass und Persönlichkeit."
  subheadline: "Kein generisches Entertainment, sondern Auftritte mit Haltung, Nähe und der richtigen Intensität für den jeweiligen Moment."
  items:
    - image: "images/hero-wedding.jpeg"
      alt: "Hochzeitsgesellschaft mit Brautpaar im Freien, im Vordergrund ein Gitarrist"
      caption: "Trauung im Freien, begleitet mit Live-Gitarre"
      size: "wide"
    - image: "images/gallery-live-bw.png"
      alt: "Schwarz-weiß-Aufnahme eines Musikers mit Akustikgitarre am Mikrofon"
      caption: "Nah, akustisch und ohne Distanz zum Publikum"
      size: "standard"
    - image: "images/portrait-green.jpg"
      alt: "George Matters bei einem Auftritt im grünen Anzug"
      caption: "Eigenständige Ästhetik mit Charakter"
      size: "standard"
    - image: "images/gallery-funeral.webp"
      alt: "Duo mit zwei Akustikgitarren bei einem Auftritt vor Bergpanorama"
      caption: "Duo-Besetzung bei einer Feier vor Bergkulisse"
      size: "standard"
    - image: "images/gallery-live-close.png"
      alt: "Gitarrist auf einer Bühne im roten Bühnenlicht neben einem Schlagzeug"
      caption: "Bandkontext mit voller Bühnenpräsenz"
      size: "standard"
    - image: "images/gallery-duo-lake.jpg"
      alt: "Zwei Musiker in Wintermänteln nebeneinander an einem See"
      caption: "Duo-Formation zwischen den Auftritten"
      size: "standard"
    - image: "images/gallery-boat.jpg"
      alt: "Schwarz-weiß-Aufnahme zweier Musiker auf einem alten Holzboot"
