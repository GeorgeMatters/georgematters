highlights:
  items:
    - title: "Musikalisch vielseitig"
      text: "Singer/Songwriter, Folk, Blues, Alternative und Pop-Elemente greifen organisch ineinander."
      icon: "blend"
    - title: "Anlassgerecht kuratiert"
      text: "Setlists, Dynamik und Besetzung werden auf Zeremonie, Empfang, Bühne oder Raum abgestimmt."
      icon: "spark"
    - title: "Erfahren auf vielen Bühnen"
      text: "Live-Auftritte führten George Matters durch Österreich, Irland, Spanien, Italien, Kroatien und Deutschland."
      icon: "map"
    - title: "Flexibel buchbar"
      text: "Vom intimen Solo-Set bis zu Duo- und Projektformaten entsteht ein passendes musikalisches Setup."
      icon: "layers"

story:
  kicker: "Profil"
  headline: "George Matters verbindet Songwriting, Atmosphäre und Persönlichkeit."
  paragraphs:
    - "George Matters ist ein österreichischer Künstler, dessen musikalische Wurzeln sich durch unterschiedliche Genres schlagen. Seine Handschrift verbindet Singer/Songwriter, Folk, Blues und Alternative mit feinen Pop-Elementen."
    - "Ob intime Zeremonie, bewegender Abschied oder stilvolle Abendbegleitung: Der Fokus liegt auf einer Präsenz, die den Anlass trägt, ohne ihn zu überdecken."
  quote: "Live-Musik bereichert besondere Momente, wenn sie nicht nur gut klingt, sondern den Raum richtig liest."
  image: "images/portrait-studio.jpg"
  imageAlt: "Studio-Porträt von George Matters"
  genresLabel: "Genres"
  countriesLabel: "Live gespielt in"
  facts:
    - label: "Bühnenerfahrung"
      value: "20+ Jahre"
    - label: "Live-Länder"
      value: "6"
    - label: "Formate"
      value: "Solo, Duo, Projekte"

services:
  kicker: "Anlässe"
  headline: "Für diese Formate ist George Matters buchbar."
  subheadline: "Jeder Rahmen verlangt eine andere musikalische Dichte. Die Besetzung und Dramaturgie werden auf Anlass, Publikum und Ort abgestimmt."
  items:
    - title: "Hochzeiten"
      text: "Live-Musik für Trauung, Agape und Abend mit warmer, persönlicher Atmosphäre."
      icon: "flower"
    - title: "Veranstaltungen"
      text: "Für Firmenfeiern, private Feste und kulturelle Formate mit stilvoller musikalischer Präsenz."
      icon: "spark"
    - title: "Trauerfeiern"
      text: "Würdevolle Begleitung für Abschiede mit sensibler Auswahl und ruhiger Ausführung."
      icon: "candle"
    - title: "Solokonzerte"
      text: "Eigenständige Auftritte seit 2013 mit Songs zwischen Folk, Blues, Alternative und Pop."
      icon: "mic"
    - title: "Individuelle Pakete"
      text: "Maßgeschneiderte Lösungen für besondere Konzepte, Wunschabläufe und wechselnde Projektgrößen."
      icon: "sliders"

