name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Minimum necessary. `pages` + `id-token` are required by deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a half-finished deploy; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      # `npm ci` installs strictly from package-lock.json. npm only records
      # optional platform binaries for the machine that generated the lockfile,
      # so a lockfile written on macOS contains @img/sharp-darwin-* and no
      # Linux build. On this runner that makes sharp unavailable and every
      # Astro image transform fails. `npm install` re-resolves the optional
      # dependencies for the current platform while still honouring the
      # locked versions.
      - run: npm install --no-audit --no-fund
      - name: Validate content and check for hard-coded business data
        run: node scripts/check-no-hardcoded-content.mjs
      - run: npm run build
      - name: Fail if secrets leaked into the build output
        run: node scripts/check-no-secrets.mjs
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
